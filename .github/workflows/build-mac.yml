# Builds Unity Launcher on GitHub for Apple Silicon and Intel Macs, and publishes both on
# the repository's Releases page. Start it from the Actions tab: Build Mac app, then
# Run workflow. It needs no keys: CurseForge goes through the launcher's proxy.
name: Build Mac app

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mac

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            label: Apple Silicon
            file: Unity-Launcher-mac-apple-silicon.zip
          - runner: macos-15-intel
            label: Intel
            file: Unity-Launcher-mac-intel.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Blockbench is built from its pinned official source, then reused until
      # scripts/build-blockbench.cjs changes. It's the same for both kinds of Mac.
      - name: Reuse Blockbench
        id: blockbench
        uses: actions/cache@v6
        with:
          path: vendor/blockbench
          key: blockbench-${{ hashFiles('scripts/build-blockbench.cjs') }}

      - name: Build Blockbench
        if: steps.blockbench.outputs.cache-hit != 'true'
        run: npm run blockbench:build

      - name: Build the app
        run: |
          npx tsc -b
          npx vite build
          npx electron-builder --mac dir --publish never

      - name: Zip it
        run: |
          app=$(find release -maxdepth 2 -name "Unity Launcher.app" -type d | head -1)
          test -n "$app" || { echo "The app wasn't built."; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$app" "${{ matrix.file }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Unity Launcher, build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. Download the zip for your Mac: Apple Silicon (an M1 chip or later) or Intel. The README says how to install it." \
            --latest
